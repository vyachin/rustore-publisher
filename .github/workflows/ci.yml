name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Сборка
        run: go build ./...

      - name: Проверка кода
        run: go vet ./...

      - name: Тесты с детектором гонок
        run: go test -race ./...

      - name: Форматирование
        run: test -z "$(gofmt -l cmd internal)"

